name: Nodejitsu
description: Nodejitsu Inc. was a cloud Platform-as-a-Service (PaaS) for hosting and deploying Node.js
  applications, founded in New York in April 2010 by Charlie Robbins, Marak Squires, and Paolo Fragomeni.
  It offered a `jitsu` command-line deployment tool and an application hosting platform, and stewarded
  popular open-source Node.js projects (forever, jitsu, flatiron, haibu, node-http-proxy). GoDaddy
  acquired Nodejitsu in February 2015 and wound down the PaaS the same year, directing customers to
  migrate elsewhere. The company is defunct - the nodejitsu.com domain no longer resolves and there is
  no live API surface; only the archived GitHub organization survives.
